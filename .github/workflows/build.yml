name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  APP_NAME: "Vidya verse"
  APP_ID: "com.vidyaverse.app"
  APP_URL: "https://adityay35425-sketch.github.io/My-app/"
  BG_COLOR: "#E7EEFE"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          mkdir -p www assets
          echo '<html><body>Loading...</body></html>' > www/index.html
          cat > www/offline.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <title>Offline</title>
          <style>
          html,body{height:100%;margin:0}
          body{display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;font-family:system-ui,-apple-system,Roboto,sans-serif;background:linear-gradient(160deg,#E7EEFE 0%,#EDE6FB 50%,#F8E6F3 100%);color:#1E293B}
          .card{width:100%;max-width:380px;background:#fff;border-radius:32px;padding:36px 28px;text-align:center;box-shadow:0 20px 50px rgba(99,102,241,.18)}
          .ic{width:84px;height:84px;margin:0 auto 22px;border-radius:50%;background:#EEF0FF;display:flex;align-items:center;justify-content:center}
          h1{font-size:22px;margin:0 0 28px;line-height:1.3}
          button{width:100%;border:0;border-radius:18px;padding:16px;font-size:17px;font-weight:700;color:#fff;background:linear-gradient(90deg,#4F46E5,#9333EA);box-shadow:0 10px 24px rgba(124,58,237,.3)}
          button:active{opacity:.85}
          </style>
          </head>
          <body>
          <div class="card">
          <div class="ic">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#6D5BF0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="2" y1="2" x2="22" y2="22"/><path d="M8.5 16.4a5 5 0 0 1 7 0"/><path d="M2 8.8a15 15 0 0 1 4.2-2.6"/><path d="M10.7 5.1A15 15 0 0 1 22 8.8"/><path d="M5 12.9a10 10 0 0 1 5.2-2.7"/><path d="M15 11a10 10 0 0 1 4 2"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
          </div>
          <h1>Check your internet connection</h1>
          <button id="retry">Retry</button>
          </div>
          <script>
          var APP_URL = "__APP_URL__";
          function go(){ window.location.replace(APP_URL); }
          document.getElementById("retry").addEventListener("click", go);
          window.addEventListener("online", go);
          </script>
          </body>
          </html>
          HTML
          sed -i "s#__APP_URL__#$APP_URL#g" www/offline.html
          cp icon.png assets/icon-only.png
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets
          cat > capacitor.config.json <<EOF
          {"appId":"$APP_ID","appName":"$APP_NAME","webDir":"www","backgroundColor":"$BG_COLOR","android":{"backgroundColor":"$BG_COLOR"},"server":{"url":"$APP_URL","errorPath":"offline.html"}}
          EOF
          npx cap add android
          JDIR="android/app/src/main/java/$(echo $APP_ID | tr . /)"
          mkdir -p "$JDIR"
          cat > "$JDIR/MainActivity.java" <<EOF
          package $APP_ID;
          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.Window;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              Window w = getWindow();
              WindowCompat.setDecorFitsSystemWindows(w, false);
              w.setStatusBarColor(Color.TRANSPARENT);
              w.setNavigationBarColor(Color.TRANSPARENT);
              if (Build.VERSION.SDK_INT >= 28) {
                w.getAttributes().layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
              }
              WindowInsetsControllerCompat c = WindowCompat.getInsetsController(w, w.getDecorView());
              c.hide(WindowInsetsCompat.Type.systemBars());
              c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
            }
          }
          EOF
          sed -i 's#<item name="windowNoTitle">true</item>#<item name="windowNoTitle">true</item><item name="android:windowFullscreen">true</item><item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>#' android/app/src/main/res/values/styles.xml
          npx capacitor-assets generate --android
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
