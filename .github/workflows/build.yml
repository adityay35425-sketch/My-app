name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  APP_NAME: "Vidya verse"
  APP_ID: "com.vidyaverse.app"
  APP_URL: "https://adityay35425-sketch.github.io/My-app/"
  BG_COLOR: "#E7EEFE"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          mkdir -p www assets
          echo '<html><body>Loading...</body></html>' > www/index.html
          cp icon.png assets/icon-only.png
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets
          cat > capacitor.config.json <<EOF
          {"appId":"$APP_ID","appName":"$APP_NAME","webDir":"www","backgroundColor":"$BG_COLOR","android":{"backgroundColor":"$BG_COLOR"},"server":{"url":"$APP_URL"}}
          EOF
          npx cap add android
          JDIR="android/app/src/main/java/$(echo $APP_ID | tr . /)"
          mkdir -p "$JDIR"
          cat > "$JDIR/MainActivity.java" <<EOF
          package $APP_ID;
          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.Window;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              Window w = getWindow();
              WindowCompat.setDecorFitsSystemWindows(w, false);
              w.setStatusBarColor(Color.TRANSPARENT);
              w.setNavigationBarColor(Color.TRANSPARENT);
              if (Build.VERSION.SDK_INT >= 28) {
                w.getAttributes().layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
              }
              WindowInsetsControllerCompat c = WindowCompat.getInsetsController(w, w.getDecorView());
              c.hide(WindowInsetsCompat.Type.systemBars());
              c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
            }
          }
          EOF
          sed -i 's#<item name="windowNoTitle">true</item>#<item name="windowNoTitle">true</item><item name="android:windowFullscreen">true</item><item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>#' android/app/src/main/res/values/styles.xml
          npx capacitor-assets generate --android
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
